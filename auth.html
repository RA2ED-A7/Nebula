<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a14;
      --card: #12121f;
      --border: rgba(124, 58, 237, 0.15);
      --border-focus: #7c3aed;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-glow: rgba(124, 58, 237, 0.3);
      --pink: #ec4899;
      --cyan: #22d3ee;
      --text: #f0f0f5;
      --text-dim: #9ca3af;
      --text-muted: #6b7280;
      --input-bg: #1a1a2e;
      --error: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(168, 85, 247, 0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Floating stars */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.8; }
    }

    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--pink), transparent);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      filter: drop-shadow(0 0 12px var(--accent-glow));
    }

    .brand {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
    }

    .error-text {
      color: var(--error);
      font-size: 0.8rem;
      margin-top: 6px;
      display: none;
    }

    .error-text.visible {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .toggle-text {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-dim);
    }

    .toggle-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .toggle-text a:hover {
      text-decoration: underline;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      margin-bottom: 18px;
      display: none;
    }

    .alert.visible {
      display: block;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .name-field {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, margin 0.3s ease;
      margin-bottom: 0;
    }

    .name-field.visible {
      max-height: 80px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="logo-section">
        <svg class="logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7c3aed"/>
              <stop offset="100%" stop-color="#ec4899"/>
            </linearGradient>
            <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#a855f7"/>
              <stop offset="100%" stop-color="#22d3ee"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="1.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <circle cx="20" cy="20" r="18" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.3"/>
          <circle cx="20" cy="20" r="6" fill="url(#g1)" filter="url(#glow)"/>
          <circle cx="20" cy="20" r="3" fill="#ECEFF4" opacity="0.9"/>
          <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#g2)" stroke-width="1.2" opacity="0.5" transform="rotate(-30 20 20)"/>
          <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#g1)" stroke-width="1.2" opacity="0.5" transform="rotate(30 20 20)"/>
          <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#g2)" stroke-width="1.2" opacity="0.4" transform="rotate(90 20 20)"/>
          <circle cx="8" cy="8" r="1" fill="#a855f7" opacity="0.8"/>
          <circle cx="32" cy="10" r="0.8" fill="#ec4899" opacity="0.7"/>
          <circle cx="30" cy="30" r="1.2" fill="#22d3ee" opacity="0.6"/>
          <circle cx="6" cy="28" r="0.7" fill="#a855f7" opacity="0.5"/>
        </svg>
        <div class="brand">Nebula</div>
        <div class="subtitle" id="formSubtitle">Sign in to your account</div>
      </div>

      <div class="alert" id="alert"></div>

      <form id="authForm" novalidate>
        <div class="name-field" id="nameField">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" class="form-input" placeholder="John Doe" autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
          <div class="error-text" id="emailError">Please enter a valid email</div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Min 6 characters" autocomplete="current-password" required>
          <div class="error-text" id="passwordError">Password must be at least 6 characters</div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
      </form>

      <div class="divider">or</div>

      <div class="toggle-text">
        <span id="toggleText">Don't have an account?</span>
        <a id="toggleLink" onclick="toggleMode()">Sign up</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://hqgpjfqaorvpgdimcily.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_yIg8_s1__WPGVR_BMD4b_w_akKmWH_I';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUp = false;
    const form = document.getElementById('authForm');
    const nameField = document.getElementById('nameField');
    const submitBtn = document.getElementById('submitBtn');
    const formSubtitle = document.getElementById('formSubtitle');
    const toggleText = document.getElementById('toggleText');
    const toggleLink = document.getElementById('toggleLink');
    const alertBox = document.getElementById('alert');

    // Redirect if already logged in
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = 'index.html';

    window.toggleMode = function() {
      isSignUp = !isSignUp;
      nameField.classList.toggle('visible', isSignUp);
      submitBtn.textContent = isSignUp ? 'Create Account' : 'Sign In';
      formSubtitle.textContent = isSignUp ? 'Create a new account' : 'Sign in to your account';
      toggleText.textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
      toggleLink.textContent = isSignUp ? 'Sign in' : 'Sign up';
      hideAlert();
      form.reset();
    };

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = 'alert visible ' + type;
    }

    function hideAlert() {
      alertBox.classList.remove('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();

      // Validation
      let valid = true;
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('email').classList.add('error');
        document.getElementById('emailError').classList.add('visible');
        valid = false;
      } else {
        document.getElementById('email').classList.remove('error');
        document.getElementById('emailError').classList.remove('visible');
      }

      if (!password || password.length < 6) {
        document.getElementById('password').classList.add('error');
        document.getElementById('passwordError').classList.add('visible');
        valid = false;
      } else {
        document.getElementById('password').classList.remove('error');
        document.getElementById('passwordError').classList.remove('visible');
      }

      if (!valid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = isSignUp ? 'Creating account...' : 'Signing in...';

      try {
        if (isSignUp) {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName } }
          });
          if (error) throw error;
          if (data.user && !data.session) {
            showAlert('Check your email to confirm your account!', 'success');
          } else {
            window.location.href = 'index.html';
          }
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          });
          if (error) throw error;
          window.location.href = 'index.html';
        }
      } catch (err) {
        showAlert(err.message || 'Something went wrong');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isSignUp ? 'Create Account' : 'Sign In';
      }
    });

    // Clear errors on input
    ['email', 'password'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('error');
        document.getElementById(id + 'Error')?.classList.remove('visible');
      });
    });

    // Generate stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 50; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.animationDuration = (2 + Math.random() * 3) + 's';
      starsEl.appendChild(star);
    }
  </script>
</body>
</html>
