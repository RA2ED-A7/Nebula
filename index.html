<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula - Direct Messages</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-area">
          <!-- Unique Nebula Logo -->
          <svg class="logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#ec4899"/>
              </linearGradient>
              <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#a855f7"/>
                <stop offset="100%" stop-color="#22d3ee"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <circle cx="20" cy="20" r="18" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.3"/>
            <circle cx="20" cy="20" r="6" fill="url(#g1)" filter="url(#glow)"/>
            <circle cx="20" cy="20" r="3" fill="#ECEFF4" opacity="0.9"/>
            <!-- Orbital rings -->
            <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#g2)" stroke-width="1.2" opacity="0.5" transform="rotate(-30 20 20)"/>
            <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#g1)" stroke-width="1.2" opacity="0.5" transform="rotate(30 20 20)"/>
            <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#g2)" stroke-width="1.2" opacity="0.4" transform="rotate(90 20 20)"/>
            <!-- Stars -->
            <circle cx="8" cy="8" r="1" fill="#a855f7" opacity="0.8"/>
            <circle cx="32" cy="10" r="0.8" fill="#ec4899" opacity="0.7"/>
            <circle cx="30" cy="30" r="1.2" fill="#22d3ee" opacity="0.6"/>
            <circle cx="6" cy="28" r="0.7" fill="#a855f7" opacity="0.5"/>
            <circle cx="20" cy="4" r="0.6" fill="#ec4899" opacity="0.6"/>
          </svg>
          <span class="brand-name">Nebula</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" title="New message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="user-profile-bar">
        <div class="avatar">
          <div class="avatar-img" id="userAvatar" style="background: linear-gradient(135deg, #22d3ee, #7c3aed); color: white;">U</div>
        </div>
        <span class="user-name" id="userName">User</span>
        <button class="icon-btn sign-out-btn" id="signOutBtn" title="Sign out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

      <div class="search-box">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" class="search-input" placeholder="Search messages...">
        </div>
      </div>

      <div class="tabs">
        <button class="tab active">Primary</button>
        <button class="tab">General</button>
        <button class="tab">Requests</button>
      </div>

      <div class="conversations" id="conversationsList">
        <div class="empty-state" id="emptyFriends">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.3;">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <p>No friends yet</p>
          <span>Add friends to start chatting</span>
        </div>
      </div>
    </aside>

    <!-- Chat Area -->
    <main class="chat-area">
      <!-- Empty state when no DM selected -->
      <div class="chat-empty" id="chatEmpty">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.2;">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <h2>Your messages</h2>
        <p>Select a conversation to start chatting</p>
      </div>

      <!-- Active chat view (hidden by default) -->
      <div class="chat-active" id="chatActive" style="display: none;">
        <div class="chat-header">
          <div class="chat-user">
            <div class="avatar">
              <div class="avatar-img" id="chatAvatar" style="background: linear-gradient(135deg, #7c3aed, #ec4899); color: white;">A</div>
            </div>
            <div class="chat-user-info">
              <h3 id="chatName">Select a friend</h3>
              <div class="chat-user-status">
                <span class="status-dot"></span>
                <span id="chatStatus">Start a conversation</span>
              </div>
            </div>
          </div>
          <div class="chat-actions">
            <button class="icon-btn" title="Voice call">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
            </button>
            <button class="icon-btn" title="Video call">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
              </svg>
            </button>
            <button class="icon-btn" title="Info">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="messages" id="messagesContainer"></div>

        <div class="chat-input-area">
          <div class="input-wrapper">
            <button class="input-btn" title="Attach">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <input type="text" class="msg-input" id="msgInput" placeholder="Message...">
            <div class="input-actions">
              <button class="input-btn" title="Emoji">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
                </svg>
              </button>
              <button class="input-btn send-btn" id="sendBtn" title="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://hqgpjfqaorvpgdimcily.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_yIg8_s1__WPGVR_BMD4b_w_akKmWH_I';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Auth check
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'auth.html';
      throw new Error('Not authenticated');
    }

    const user = session.user;
    const userName = user.user_metadata?.full_name || user.email.split('@')[0];
    const userInitial = userName.charAt(0).toUpperCase();

    // Update user display
    const userAvatar = document.getElementById('userAvatar');
    const userNameEl = document.getElementById('userName');
    if (userAvatar) userAvatar.textContent = userInitial;
    if (userNameEl) userNameEl.textContent = userName;

    // Sign out
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'auth.html';
    });

    // Gradient palette for avatars
    const gradients = [
      'linear-gradient(135deg, #7c3aed, #ec4899)',
      'linear-gradient(135deg, #22d3ee, #7c3aed)',
      'linear-gradient(135deg, #ec4899, #f59e0b)',
      'linear-gradient(135deg, #22c55e, #22d3ee)',
      'linear-gradient(135deg, #f59e0b, #ef4444)',
      'linear-gradient(135deg, #a855f7, #22d3ee)',
      'linear-gradient(135deg, #ef4444, #ec4899)',
      'linear-gradient(135deg, #06b6d4, #8b5cf6)',
    ];

    // Fetch and render friends
    const conversationsList = document.getElementById('conversationsList');
    const emptyFriends = document.getElementById('emptyFriends');

    async function loadFriends() {
      const { data: friends, error } = await supabase
        .from('friend_profiles')
        .select('*');

      // Clear existing conversations (keep empty state)
      conversationsList.querySelectorAll('.conversation').forEach(c => c.remove());

      if (!friends || friends.length === 0) {
        emptyFriends.style.display = 'flex';
        return;
      }

      emptyFriends.style.display = 'none';

      friends.forEach((friend, i) => {
        const name = friend.full_name || friend.email.split('@')[0];
        const initial = name.charAt(0).toUpperCase();
        const gradient = gradients[i % gradients.length];

        const conv = document.createElement('div');
        conv.className = 'conversation';
        conv.innerHTML = `
          <div class="avatar">
            <div class="avatar-img" style="background: ${gradient}; color: white;">${initial}</div>
          </div>
          <div class="conversation-info">
            <div class="conversation-name">${name}</div>
            <div class="conversation-preview">Start a conversation</div>
          </div>
          <div class="conversation-meta">
            <span class="conversation-time">New</span>
          </div>
        `;
        conv.addEventListener('click', () => {
          conversationsList.querySelectorAll('.conversation').forEach(c => c.classList.remove('active'));
          conv.classList.add('active');

          // Show chat view
          document.getElementById('chatEmpty').style.display = 'none';
          document.getElementById('chatActive').style.display = 'flex';

          // Update chat header
          document.getElementById('chatAvatar').textContent = initial;
          document.getElementById('chatAvatar').style.background = gradient;
          document.getElementById('chatName').textContent = name;
          document.getElementById('chatStatus').textContent = 'Start a conversation';

          // Clear messages
          const messagesContainer = document.getElementById('messagesContainer');
          messagesContainer.innerHTML = '';
        });
        conversationsList.appendChild(conv);
      });
    }

    await loadFriends();

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });

    // Send message
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('messagesContainer');

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      const group = document.createElement('div');
      group.className = 'message-group sent';

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      group.innerHTML = `<div class="message sent">${text}</div><div class="message-time">${time}</div>`;

      messagesContainer.appendChild(group);
      msgInput.value = '';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
